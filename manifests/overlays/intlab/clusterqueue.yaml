# Bootstrap ClusterQueue. Hearth patches spec.resourceGroups[0].flavors when it
# discovers clusters. The Fournos Argo Application ignores that path so GitOps
# does not revert Hearth's updates.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: fournos-queue
spec:
  namespaceSelector:
    matchLabels:
      fournos.dev/queue-access: "true"
  preemption:
    withinClusterQueue: LowerPriority
    reclaimWithinCohort: Any
  resourceGroups:
    - coveredResources:
        - fournos/cluster-slot
        - fournos/gpu-a100
        - fournos/gpu-h100
        - fournos/gpu-h200
        - fournos/gpu-l4
        - fournos/gpu-l40s
        - fournos/gpu-nvidia
      flavors:
        - name: intlab-bootstrap
          resources:
            - name: fournos/cluster-slot
              nominalQuota: 0
            - name: fournos/gpu-a100
              nominalQuota: 0
            - name: fournos/gpu-h100
              nominalQuota: 0
            - name: fournos/gpu-h200
              nominalQuota: 0
            - name: fournos/gpu-l4
              nominalQuota: 0
            - name: fournos/gpu-l40s
              nominalQuota: 0
            - name: fournos/gpu-nvidia
              nominalQuota: 0

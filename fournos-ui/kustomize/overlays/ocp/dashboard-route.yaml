apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: fournos-dashboard
  labels:
    app.kubernetes.io/name: fournos-dashboard
  annotations:
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: letsencrypt-production
spec:
  host: fournos-dashboard.apps.CLUSTER_DOMAIN
  to:
    kind: Service
    name: fournos-dashboard
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
